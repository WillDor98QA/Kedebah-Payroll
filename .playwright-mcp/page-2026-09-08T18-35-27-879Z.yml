              - paragraph [ref=f5e1019]: What is this rate? The benchmark a staff loan's interest is compared against. Charge an employee less than this and the shortfall is a taxable benefit under Act 896, unless the loan is exempt — 12 months or less, and no more than 3× basic salary. Where to get it. The Bank of Ghana publishes the policy rate after each Monetary Policy Committee meeting, roughly every two months. Add a new row with the date it took effect rather than editing the old one — each loan keeps the rate that applied when it started. If you leave it unset, no benefit-in-kind is applied to staff loans at all.
